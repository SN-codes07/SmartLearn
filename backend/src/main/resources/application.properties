spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:${DB_HOST:localhost}}}:${MYSQLPORT:${MYSQL_PORT:${DB_PORT:3306}}}/${MYSQLDATABASE:${MYSQL_DATABASE:${DB_NAME:learning_platform_db}}}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:${DB_USER:root}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:${DB_PASSWORD:hackathon123}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port (supports Railway / Cloud dynamic $PORT with local fallback)
server.port=${PORT:8080}

# Gemini AI Configuration
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.gemini.model=${AI_GEMINI_MODEL:gemini-flash-latest}
