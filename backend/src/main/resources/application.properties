# Server port (supports Railway / Cloud dynamic $PORT with local fallback)
server.port=${PORT:8080}

# Spring Datasource Configuration
# Priority: System properties set by DotenvLoader -> Direct env vars -> Local fallback
spring.datasource.url=${spring.datasource.url:${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:${DB_HOST:localhost}}}:${MYSQLPORT:${MYSQL_PORT:${DB_PORT:3306}}}/${MYSQLDATABASE:${MYSQL_DATABASE:${DB_NAME:learning_platform_db}}}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}}
spring.datasource.username=${spring.datasource.username:${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:${DB_USER:root}}}}}
spring.datasource.password=${spring.datasource.password:${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:${DB_PASSWORD:hackathon123}}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gemini AI Configuration
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.gemini.model=${AI_GEMINI_MODEL:gemini-flash-latest}

