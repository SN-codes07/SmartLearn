      <rect x="0" y="0" width="386" height="110" rx="8" fill="#1b2838" stroke="#2a3e54" stroke-width="1" />
      <text x="12" y="20" fill="#65b8ff" font-size="11" font-weight="700">💡 AI Tutor Coach</text>
      <text x="12" y="38" fill="#f1f1f1" font-size="11.5">Without a <tspan fill="#7ee787" font-weight="700">visited</tspan> set, cyclic edges re-invoke DFS</text>
      <text x="12" y="54" fill="#f1f1f1" font-size="11.5">indefinitely, exceeding the OS call stack limit (O(V)):</text>
      
      <!-- Code snippet inside AI response -->
      <rect x="12" y="62" width="362" height="38" rx="4" fill="#0d1520" />
      <text x="20" y="77" fill="#7ee787" font-family="monospace" font-size="10">if (visited.has(node)) return;</text>
      <text x="20" y="92" fill="#3ea6ff" font-family="monospace" font-size="10">visited.add(node); // Prevents infinite loop</text>
    </g>

