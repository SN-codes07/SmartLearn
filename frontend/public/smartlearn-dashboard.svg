      <text x="12" y="20" fill="#0f0f0f" font-size="11.5" font-weight="600">Why does a recursive DFS cause a stack overflow</text>
      <text x="12" y="36" fill="#0f0f0f" font-size="11.5" font-weight="600">on dense graphs with cycles?</text>
    </g>

    <!-- Chat Message 3 (AI Tutor Explanation) -->
